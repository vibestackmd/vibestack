name: Release Plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          file_version=$(tr -d '[:space:]' < VERSION)
          tag_version="${{ steps.version.outputs.version }}"
          if [[ "$file_version" != "$tag_version" ]]; then
            echo "::error::VERSION file ($file_version) does not match tag ($tag_version)"
            echo "::error::Use 'make release-patch', 'make release-minor', or 'make release-major' to release."
            exit 1
          fi

      - name: Build plugin
        run: make plugin

      - name: Inspect plugin output
        run: |
          echo "::group::Plugin tree"
          find dist/plugin -type f | sort
          echo "::endgroup::"
          echo "::group::plugin.json"
          cat dist/plugin/.claude-plugin/plugin.json
          echo "::endgroup::"
          echo "::group::hooks/hooks.json"
          cat dist/plugin/hooks/hooks.json
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/vibestack-plugin-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          body: |
            ## VibeStack Plugin v${{ steps.version.outputs.version }}

            ### Install

            ```
            /plugin marketplace add vibestackmd/vibestack
            /plugin install vibestack@vibestackmd-vibestack
            ```

            Or download the tarball below and extract to `~/.claude/plugins/vibestack/`.

            ### What's included

            **Skills:** `/vibestack`, `/todo`, `/squad`, `/docs`, `/bosskey`, `/ideate`, `cli-first`, `developer-environment`, `lsp`
            **Hooks:** finish notification (audio chime), status line
